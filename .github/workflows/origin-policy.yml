name: origin-policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  enforce:
    runs-on: ubuntu-24.04
    environment: origin-policy
    steps:

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # 3.2.0
        with:
          client-id: ${{ vars.ORIGIN_POLICY_APP_ID }}
          private-key: ${{ secrets.ORIGIN_POLICY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Evaluate origin policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REQUIRED_APPROVALS: "2"
          BOT_BRANCH_PREFIXES: "poc-ci-bot/"
        shell: bash
        run: |
          set -euo pipefail
          event="$GITHUB_EVENT_PATH"

          owner="$(jq -r '.repository.owner.login' "$event")"
          repo="$(jq -r '.repository.name' "$event")"
          pr_number="$(jq -r '.pull_request.number' "$event")"
          author="$(jq -r '.pull_request.user.login' "$event")"
          head_sha="$(jq -r '.pull_request.head.sha' "$event")"
          head_ref="$(jq -r '.pull_request.head.ref' "$event")"
          base_repo="$(jq -r '.pull_request.base.repo.full_name' "$event")"
          head_repo="$(jq -r '.pull_request.head.repo.full_name // ""' "$event")"

          # Fail LOUDLY on permission/scope errors; only a clean 404
          # ("not a collaborator") maps to "none". A silent 403->none would
          # both misclassify internal PRs and zero out all approval counts.
          repo_permission() {
            local login="$1" resp status
            resp="$(gh api "/repos/${owner}/${repo}/collaborators/${login}/permission" 2>&1)" \
              && { jq -r '.permission // "none"' <<<"$resp"; return; }
            status=$?
            if grep -q "HTTP 404" <<<"$resp"; then
              echo "none"; return
            fi
            echo "::error::permission lookup for '${login}' failed (not 404) — check App scopes" >&2
            echo "$resp" >&2
            exit "$status"
          }

          has_write() {
            case "$(repo_permission "$1")" in
              admin|write) return 0 ;;
              *) return 1 ;;
            esac
          }

          IFS=', ' read -r -a bot_prefixes <<< "${BOT_BRANCH_PREFIXES:-}"
          is_bot_branch() {
            local ref="$1" p
            for p in "${bot_prefixes[@]}"; do
              [[ -n "$p" && "$ref" == "$p"* ]] && return 0
            done
            return 1
          }

          if [[ -z "$head_repo" || "$head_repo" != "$base_repo" ]]; then
            elevated=true;  origin="fork/external-origin PR"
          elif has_write "$author"; then
            elevated=false; origin="internal PR from a write-access collaborator"
          elif is_bot_branch "$head_ref"; then
            elevated=false; origin="scoped automation in locked namespace"
          else
            elevated=true;  origin="internal PR from a non-write, non-bot author"
          fi

          if [[ "$elevated" != "true" ]]; then
            state="success"
            description="${origin} — four-eyes enforced by branch ruleset"
          else
            # Exclude EVERY login appearing as author or committer on ANY
            # commit in the PR, plus the PR opener. Rationale: commit
            # author/committer logins are resolved from attacker-chosen email
            # metadata, so a "who pushed the head commit" exclusion is
            # spoofable. A blanket participant exclusion is fail-closed:
            # forged emails can only REMOVE eligible approvers, never restore
            # the forger's own eligibility for a commit they signed as
            # someone else. The authoritative anti-self-approval control is
            # the ruleset's require_last_push_approval (server-side pusher
            # identity); this is defense-in-depth on top of it.
            mapfile -t participants < <(
              gh api --paginate "/repos/${owner}/${repo}/pulls/${pr_number}/commits" \
                --jq '.[] | (.author.login // empty), (.committer.login // empty)' \
              | sort -u
            )

            excluded() {
              local login="$1" p
              [[ "$login" == "$author" ]] && return 0
              for p in "${participants[@]}"; do
                [[ "$login" == "$p" ]] && return 0
              done
              return 1
            }

            latest_json="$(
              gh api --paginate \
                "/repos/${owner}/${repo}/pulls/${pr_number}/reviews" \
                --jq '.[] | {login: .user.login, state: .state, commit_id: .commit_id}' \
              | jq -s 'reduce .[] as $r ({}; .[$r.login] = $r)'
            )"

            mapfile -t candidates < <(
              echo "$latest_json" | jq -r --arg sha "$head_sha" '
                to_entries[]
                | select(.value.state == "APPROVED")
                | select(.value.commit_id == $sha)
                | .key
              '
            )

            approvals=0
            for login in "${candidates[@]}"; do
              [[ -z "$login" || "$login" == "null" ]] && continue
              excluded "$login" && continue
              has_write "$login" && approvals=$((approvals + 1))
            done

            if [[ "$approvals" -ge "$REQUIRED_APPROVALS" ]]; then
              state="success"
              description="${origin}: ${approvals}/${REQUIRED_APPROVALS} write-access approvals"
            else
              state="failure"
              description="${origin}: ${approvals}/${REQUIRED_APPROVALS} write-access approvals required"
            fi
          fi

          gh api --method POST \
            "/repos/${owner}/${repo}/statuses/${head_sha}" \
            -f state="$state" \
            -f description="$description" \
            -f context="origin-policy"
