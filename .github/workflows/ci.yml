name: CI

on:
  pull_request:

# Read-only default. No broader scopes are granted anywhere in this workflow.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # pinned to 7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9	# refs/tags/v6.0.9 # v4.1.0
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@SETUP_NODE_SHA_PLACEHOLDER # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages)
        run: pnpm -r build

      - name: Test (all packages)
        run: pnpm -r test
