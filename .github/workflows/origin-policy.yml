name: origin-policy

# Trusted half of the fork-only 2-approval gate. Started by the completion of
# origin-policy-detect.yml (see that file for WHY the work is split in two).
#
# workflow_run always runs from the base repo's default branch in the trusted
# context, WITH access to this repo's Actions secrets/variables — even when the
# run that triggered it came from a fork PR. That is exactly the property the
# detector→evaluator split buys us: the App token can be minted here on fork
# PRs, which is impossible in a pull_request_review-triggered run on a public
# repo.
#
# The detector hands over only the PR number (an unforgeable, GitHub-assigned
# integer). Everything security-relevant — author, head SHA, PR origin, the
# approval set — is re-derived here from the API using the App token, so no
# attacker-influenced data from the untrusted run is trusted.
on:
  workflow_run:
    workflows: ["origin-policy-detect"]
    types: [completed]

permissions: {}

jobs:
  enforce:
    runs-on: ubuntu-24.04
    environment: origin-policy
    # Only act when the detector actually produced its artifact. A cancelled or
    # failed detector run has nothing to evaluate.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      # Download the PR-number artifact from the triggering run. This is the
      # workflow's OWN GITHUB_TOKEN; the origin-policy evaluation itself uses the
      # App token minted below, not this token.
      actions: read
    steps:

      - name: Download PR number
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pinned to 8.0.1
        with:
          name: origin-policy-pr
          path: pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # pinned to 3.2.0
        with:
          client-id: ${{ vars.ORIGIN_POLICY_APP_ID }}
          private-key: ${{ secrets.ORIGIN_POLICY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Evaluate origin policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REQUIRED_APPROVALS: "2"
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          # Branch namespaces locked by a repository ruleset so ONLY the owning
          # App can write them (infra/terraform/rulesets.tf -> bot_namespace).
          # Comma/space separated. A same-repo PR whose head sits under one of
          # these was necessarily produced by that scoped bot (humans are
          # ruleset-blocked from pushing there), so it rides the normal
          # single-approval four-eyes path instead of the fork +1 gate.
          BOT_BRANCH_PREFIXES: "poc-ci-bot/"
        shell: bash
        run: |
          set -euo pipefail
          owner="$OWNER"
          repo="$REPO"

          # The detector persisted only the PR number. Validate it is a bare
          # integer before trusting it in an API path.
          pr_number="$(tr -d '[:space:]' < pr/number)"
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "invalid PR number from detector artifact: '$pr_number'" >&2
            exit 1
          fi

          # Re-derive every security-relevant field fresh from the API in this
          # trusted context — do NOT trust anything else from the detector run.
          pr_json="$(gh api "/repos/${owner}/${repo}/pulls/${pr_number}")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          base_repo="$(jq -r '.base.repo.full_name' <<<"$pr_json")"
          # Empty when the fork repo has been deleted — treat that as external too.
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"

          repo_permission() {
            local login="$1" resp
            if ! resp="$(gh api "/repos/${owner}/${repo}/collaborators/${login}/permission" 2>/dev/null)"; then
              echo "none"; return
            fi
            echo "$resp" | jq -r '.permission // "none"'
          }

          has_write() {
            case "$(repo_permission "$1")" in
              admin|write) return 0 ;;
              *) return 1 ;;
            esac
          }

          # A same-repo head ref under a ruleset-locked bot namespace can only
          # have been written by the owning App (the namespace ruleset blocks all
          # human pushes there), so such a PR is trusted scoped automation.
          IFS=', ' read -r -a bot_prefixes <<< "${BOT_BRANCH_PREFIXES:-}"
          is_bot_branch() {
            local ref="$1" p
            for p in "${bot_prefixes[@]}"; do
              [[ -n "$p" && "$ref" == "$p"* ]] && return 0
            done
            return 1
          }

          # Classify the PR. Only fork/external-origin PRs — and the anomalous
          # case of an internal branch whose author is neither a write-access
          # human nor a scoped bot — get the elevated 2-approval fork gate.
          # Internal write-user PRs and scoped-bot PRs rely on the branch
          # ruleset's normal single code-owner review (still four-eyes: the bot
          # cannot approve, and require_last_push_approval blocks self-approval).
          # FUTURE (planned): fork PRs unconditionally require 2 approvals today.
          # A later iteration can fold in a contributor-trust score before this
          # branch — e.g. GitHub account age, prior merged-PR / commit history in
          # this org, 2FA-enabled, verified email, org-membership — and once a
          # fork author clears that bar, route them to the single-review path
          # (elevated=false) so a trusted external contributor is accepted after
          # 1 review instead of 2. Keep 2 approvals as the safe default for
          # unknown / low-trust authors, and derive the score from signals the
          # author cannot cheaply forge (sockpuppet accounts are new, historyless,
          # and unverified — exactly what such classifiers would catch).
          if [[ -z "$head_repo" || "$head_repo" != "$base_repo" ]]; then
            elevated=true;  origin="fork/external-origin PR"
          elif has_write "$author"; then
            elevated=false; origin="internal PR from a write-access collaborator"
          elif is_bot_branch "$head_ref"; then
            elevated=false; origin="scoped automation in locked namespace ${head_ref}"
          else
            elevated=true;  origin="internal PR from a non-write, non-bot author"
          fi

          if [[ "$elevated" != "true" ]]; then
            state="success"
            description="${origin} — four-eyes enforced by branch ruleset"
          else
            # Elevated gate: require REQUIRED_APPROVALS approvals from write-access
            # users, excluding both the PR's opening author AND whoever authored
            # the current head commit. These can differ (e.g. a bot opens the PR,
            # a human pushes a later commit) — anchoring only on $author lets that
            # human's own approval of their own push count toward the requirement,
            # the same self-approval-via-non-authorship bypass this policy closes.
            # Pulled via the pull-requests commits list (Pull requests: read),
            # not the commits API (which needs Contents: read) — this App is
            # scoped to PR/review/status access only.
            head_pusher="$(
              gh api --paginate "/repos/${owner}/${repo}/pulls/${pr_number}/commits" \
                --jq '.[] | {sha: .sha, login: (.author.login // .committer.login // "")}' \
              | jq -rs --arg sha "$head_sha" '.[] | select(.sha == $sha) | .login' \
              | tail -n1
            )"

            latest_json="$(
              gh api --paginate \
                "/repos/${owner}/${repo}/pulls/${pr_number}/reviews" \
                --jq '.[] | {login: .user.login, state: .state, commit_id: .commit_id}' \
              | jq -s 'reduce .[] as $r ({}; .[$r.login] = $r)'
            )"

            mapfile -t candidates < <(
              echo "$latest_json" | jq -r --arg sha "$head_sha" --arg author "$author" --arg pusher "$head_pusher" '
                to_entries[]
                | select(.value.state == "APPROVED")
                | select(.value.commit_id == $sha)
                | select(.key != $author)
                | select($pusher == "" or .key != $pusher)
                | .key
              '
            )

            approvals=0
            for login in "${candidates[@]}"; do
              [[ -z "$login" || "$login" == "null" ]] && continue
              has_write "$login" && approvals=$((approvals + 1))
            done

            if [[ "$approvals" -ge "$REQUIRED_APPROVALS" ]]; then
              state="success"
              description="${origin}: ${approvals}/${REQUIRED_APPROVALS} write-access approvals"
            else
              state="failure"
              description="${origin}: ${approvals}/${REQUIRED_APPROVALS} write-access approvals required"
            fi
          fi

          gh api --method POST \
            "/repos/${owner}/${repo}/statuses/${head_sha}" \
            -f state="$state" \
            -f description="$description" \
            -f context="origin-policy"
