name: Fork Review Policy

# Fork PRs need >= 2 approvals; internal (same-repo) PRs keep the ruleset's
# baseline of 1. GitHub rulesets can't vary the count by PR source, so this
# check supplies it. Wired in as a required status check via Terraform:
# var.required_status_checks -> "fork-review-policy".
#
# Two things this does, and what each costs:
#   1. Detect FORK->REPO vs REPO->REPO   -> ZERO API calls. A fork PR is simply
#      one whose HEAD repo differs from the BASE repo (see IS_FORK below). No
#      branch-name guessing; the branch name is not a reliable signal.
#   2. Count current approvals            -> ONE API call. An event only carries
#      a single review, never the running total, so the tally must be fetched.
#      Uses the built-in GITHUB_TOKEN — no API key / secret involved.
#
# SECURITY: runs on pull_request_target (base-repo context) ONLY so it can WRITE
# a commit status (fork `pull_request` runs get a read-only token). It MUST NOT
# check out or run the fork's code — it reads review metadata and nothing else.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  statuses: write
  pull-requests: read

jobs:
  fork-review-policy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
      NUMBER: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      # FORK->REPO detection, no API call: head repo != base repo.
      IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name }}
    steps:
      - name: Enforce fork approval policy
        run: |
          set -euo pipefail
          status() {
            gh api -X POST "repos/$REPO/statuses/$SHA" \
              -f state="$1" -f context=fork-review-policy -f description="$2" >/dev/null
          }

          if [ "$IS_FORK" != "true" ]; then
            status success "internal PR — ruleset approval count applies"
            exit 0
          fi

          # The one API call: distinct approvers, latest review state per user,
          # PR author excluded. awk keeps the LAST state seen per user (reviews
          # come back chronological) and counts those still APPROVED.
          approvals=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" \
            --jq '.[] | select(.state=="APPROVED" or .state=="CHANGES_REQUESTED" or .state=="DISMISSED") | [.user.login, .state] | @tsv' \
            | awk -v me="$AUTHOR" '$1!=me{s[$1]=$2} END{n=0; for(u in s) if(s[u]=="APPROVED") n++; print n}')

          if [ "$approvals" -ge 2 ]; then
            status success "$approvals fork approvals"
          else
            status failure "$approvals/2 fork approvals — needs a second reviewer"
            exit 1
          fi
